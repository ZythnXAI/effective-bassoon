# Ubuntu + Cinnamon (visual Windows 11) + Tailscale + xrdp
# Secrets: TAILSCALE_AUTH_KEY (obrigatório) | RDP_PASSWORD (opcional)
name: Ubuntu-Win11-RDP

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:
      - name: Setup RDP + Cinnamon + Windows 11 Theme
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::Secret TAILSCALE_AUTH_KEY nao definido."
            exit 1
          fi

          echo "::group::Atualizando sistema e instalando dependencias"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cinnamon cinnamon-session cinnamon-settings-daemon \
            gnome-terminal nautilus \
            xrdp tigervnc-standalone-server dbus-x11 \
            curl wget git unzip \
            gnome-tweaks gnome-shell-extensions \
            sassc libglib2.0-dev-bin
          echo "::endgroup::"

          echo "::group::Configurando xrdp para Cinnamon"
          # Impede o xrdp de iniciar uma sessao Xorg propria
          sudo sed -i 's/^new_cursors=true/new_cursors=false/' /etc/xrdp/xrdp.ini
          sudo sed -i 's/^#xserverbpp=24/xserverbpp=24/' /etc/xrdp/xrdp.ini

          # Cria script de inicio para o usuario
          cat << 'XSESSION' | sudo tee /etc/skel/.xsession > /dev/null
          #!/bin/bash
          export XDG_SESSION_DESKTOP=cinnamon
          export XDG_CURRENT_DESKTOP=X-Cinnamon
          exec cinnamon-session
          XSESSION
          sudo chmod +x /etc/skel/.xsession

          # Configura xrdp para usar o .xsession
          sudo sed -i 's|^#startwm.sh.*|startwm.sh|' /etc/xrdp/startwm.sh
          echo '#!/bin/sh' | sudo tee /etc/xrdp/startwm.sh
          echo 'if [ -r /etc/default/locale ]; then . /etc/default/locale; export LANG LANGUAGE; fi' | sudo tee -a /etc/xrdp/startwm.sh
          echo 'exec cinnamon-session' | sudo tee -a /etc/xrdp/startwm.sh
          sudo chmod +x /etc/xrdp/startwm.sh

          # Desabilita Wayland (xrdp precisa de X11)
          sudo sed -i 's/#WaylandEnable=false/WaylandEnable=false/' /etc/gdm3/custom.conf
          sudo systemctl restart xrdp
          echo "::endgroup::"

          echo "::group::Aplicando tema Windows 11 (Win11 GTK Theme)"
          cd /tmp
          git clone --depth 1 https://github.com/yeyushengfan258/Windows11-gtk-theme.git
          cd Windows11-gtk-theme
          ./install.sh -c dark -l
          cd /tmp

          # Icones Windows 11
          git clone --depth 1 https://github.com/yeyushengfan258/Win11-icon-theme.git
          cd Win11-icon-theme
          ./install.sh
          cd /tmp

          # Cursor Windows 11
          git clone --depth 1 https://github.com/yeyushengfan258/Win11-cursor-theme.git 2>/dev/null || true
          if [ -d "Win11-cursor-theme" ]; then
            cd Win11-cursor-theme
            ./install.sh 2>/dev/null || true
            cd /tmp
          fi

          # Aplica tema via gsettings (Cinnamon usa gsettings para temas GTK)
          # Cria script que sera aplicado no primeiro login
          cat << 'THEME' | sudo tee /usr/local/bin/apply-win11-theme.sh > /dev/null
          #!/bin/bash
          sleep 5
          gsettings set org.cinnamon.desktop.interface gtk-theme 'Windows11-Dark'
          gsettings set org.cinnamon.desktop.interface icon-theme 'Win11'
          gsettings set org.cinnamon.desktop.interface cursor-theme 'Win11'
          gsettings set org.cinnamon.desktop.background picture-uri 'file:///usr/share/backgrounds/windows11.jpg'
          gsettings set org.cinnamon.theme name 'Windows11-Dark'
          THEME
          sudo chmod +x /usr/local/bin/apply-win11-theme.sh

          # Adiciona ao autostart do Cinnamon
          sudo mkdir -p /etc/skel/.config/autostart
          cat << 'AUTOSTART' | sudo tee /etc/skel/.config/autostart/apply-win11-theme.desktop > /dev/null
          [Desktop Entry]
          Type=Application
          Name=Apply Win11 Theme
          Exec=/usr/local/bin/apply-win11-theme.sh
          Hidden=false
          X-GNOME-Autostart-enabled=true
          AUTOSTART

          # Copia wallpaper do Windows 11 (substitua pela URL da sua imagem preferida)
          sudo mkdir -p /usr/share/backgrounds
          sudo wget -q -O /usr/share/backgrounds/windows11.jpg \
            "https://images.unsplash.com/photo-1633519237438-7b2b0a1d1b1b?w=1920" 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::Criando usuario RDP"
          if [ -n "$RDP_PASSWORD" ]; then
            PASSWORD="$RDP_PASSWORD"
            SHOWN="(a que voce definiu no secret RDP_PASSWORD)"
          else
            PASSWORD=$(openssl rand -base64 16 | tr -d '/+=' | head -c 16)
            SHOWN="$PASSWORD"
          fi

          sudo useradd -m -s /bin/bash -G sudo RDP
          echo "RDP:$PASSWORD" | sudo chpasswd
          echo "RDP ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/rdp > /dev/null

          # Forca o uso do Cinnamon no login
          echo "exec cinnamon-session" | sudo tee /home/RDP/.xsession > /dev/null
          sudo chown RDP:RDP /home/RDP/.xsession
          echo "::endgroup::"

          echo "::group::Instalando Tailscale"
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

          # Conecta ao Tailscale com retry
          CONNECTED=false
          for attempt in 1 2 3; do
            if sudo tailscale up \
              --authkey="$TS_AUTHKEY" \
              --hostname="gh-runner-$GITHUB_RUN_ID" \
              --unattended \
              --accept-dns=false \
              --timeout=60s 2>&1; then
              CONNECTED=true
              break
            fi
            echo "::warning::tailscale up falhou (tentativa $attempt/3)"
            sleep 5
          done

          if [ "$CONNECTED" = false ]; then
            echo "::error::Falha ao conectar no Tailscale. Confira o secret TAILSCALE_AUTH_KEY."
            exit 1
          fi

          # Obtem IP do Tailscale
          IP=""
          for i in $(seq 1 20); do
            IP=$(tailscale ip -4 2>/dev/null | head -1)
            [ -n "$IP" ] && break
            sleep 1
          done

          if [ -z "$IP" ]; then
            echo "::error::Tailscale nao atribuiu um IP."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Verificando RDP na porta 3389"
          LISTENING=false
          for i in $(seq 1 15); do
            if nc -zv "$IP" 3389 2>/dev/null; then
              LISTENING=true
              break
            fi
            sleep 1
          done

          if [ "$LISTENING" = false ]; then
            echo "::error::A porta 3389 nao respondeu em $IP."
            exit 1
          fi
          echo "::endgroup::"

          echo ""
          echo "=============== ACESSO RDP ==============="
          echo "Endereco : $IP"
          echo "Usuario  : RDP"
          echo "Senha    : $SHOWN"
          echo "=========================================="
          echo "Dica: no mstsc > Experiencia, escolha \"LAN\"."
          echo ""

          # Mantem o runner ativo
          while true; do
            sleep 900
            echo "[$(date +'%H:%M:%S')] RDP ativo em $IP"
          done

      - name: Remover no do Tailscale
        if: always()
        run: |
          if command -v tailscale &>/dev/null; then
            sudo tailscale logout || true
          fi
          exit 0
