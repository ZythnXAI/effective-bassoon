name: Windows RDP via Tailscale

on:
  workflow_dispatch:

permissions: {}

jobs:
  secure-rdp:
    runs-on: windows-latest
    # GitHub-hosted runners têm limite de execução; 360 min é o padrão máximo do job.
    timeout-minutes: 360

    steps:
      - name: Prepare RDP, Firewall, and Animations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rdpTcp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          # Ativa RDP com NLA e TLS
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          Set-ItemProperty $rdpTcp UserAuthentication 1
          Set-ItemProperty $rdpTcp SecurityLayer 2
          Set-ItemProperty $rdpTcp MinEncryptionLevel 3

          # Configura Firewall restrito ao Tailscale
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' | Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale-TCP','RDP-Tailscale-UDP' | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' | Out-Null

          # Inicia o Serviço
          Set-Service TermService -StartupType Manual
          Start-Service TermService

          # Configura Perfil Padrão e Animações 1x
          $defaultHiveFile = Join-Path $env:SystemDrive 'Users\Default\NTUSER.DAT'
          reg.exe load 'HKU\RDPDefaultProfile' $defaultHiveFile | Out-Null
          try {
            $vfx = 'Registry::HKEY_USERS\RDPDefaultProfile\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
            $wm = 'Registry::HKEY_USERS\RDPDefaultProfile\Control Panel\Desktop\WindowMetrics'
            New-Item -Path $vfx, $wm -Force | Out-Null
            
            # VisualFXSetting = 2 força "Melhor Aparência" (Todas as animações ativas em 1x nativo)
            New-ItemProperty -Path $vfx -Name VisualFXSetting -PropertyType DWord -Value 2 -Force | Out-Null
            
            # MinAnimate = "1" mantém a escala de animação nativa (1x) ativada explicitamente
            New-ItemProperty -Path $wm -Name MinAnimate -PropertyType String -Value '1' -Force | Out-Null
          } finally {
            reg.exe unload 'HKU\RDPDefaultProfile' | Out-Null
          }

      - name: Create RDP Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw 'Defina o secret RDP_PASSWORD.' }
          if ($env:RDP_PASSWORD.Length -lt 16 -or $env:RDP_PASSWORD -notmatch '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[^a-zA-Z0-9]).+$') {
            throw 'RDP_PASSWORD: Mínimo 16 caracteres, com maiúscula, minúscula, número e símbolo.'
          }
          $pass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser RDP -ErrorAction SilentlyContinue) { Set-LocalUser RDP -Password $pass }
          else { New-LocalUser RDP -Password $pass -AccountNeverExpires | Out-Null }
          Add-LocalGroupMember -Group Administrators, 'Remote Desktop Users' -Member RDP -ErrorAction SilentlyContinue
          Write-Host 'Conta RDP pronta.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          Invoke-WebRequest -UseBasicParsing 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait
          Remove-Item $msi -Force -ErrorAction SilentlyContinue

      - name: Connect Tailscale & Verify
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw 'Defina o secret TAILSCALE_AUTH_KEY.' }
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=gh-rdp-$env:GITHUB_RUN_ID" '--accept-dns=false'
          
          $ip = $null
          for ($i=0; $i -lt 30 -and -not $ip; $i++) {
            $candidate = & $tailscale ip -4 2>$null | Select-Object -First 1
            if ($candidate) {
              $candidate = $candidate.Trim()
              if ($candidate -match '^100\.') { $ip = $candidate } else { Start-Sleep 2 }
            } else { Start-Sleep 2 }
          }
          if (-not $ip) { throw 'Falha ao obter IP do Tailscale.' }

          for ($i=0; $i -lt 15 -and -not (Test-NetConnection 127.0.0.1 -Port 3389 -InformationLevel Quiet); $i++) { Start-Sleep 2 }

          @('## Acesso RDP', '', "- **IP Tailscale:** $ip`:3389", '- **Usuário:** RDP', '- **Senha:** Secret RDP_PASSWORD', '- **Animações:** Ativadas (Escala 1x)') | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "RDP pronto em $ip`:3389."

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo. Cancele o workflow para encerrar."
            Start-Sleep 300
          }
