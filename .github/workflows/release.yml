name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: NexusMind AI v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🚀 Release v${{ steps.version.outputs.VERSION }}

            ### Changes

            - Full changelog available in [CHANGELOG.md](https://github.com/ZythnXAI/effective-bassoon/blob/main/CHANGELOG.md)

            ### Downloads

            - [Backend Docker Image](https://hub.docker.com/r/nexusmind/nexusmind-backend)
            - [Frontend Docker Image](https://hub.docker.com/r/nexusmind/nexusmind-frontend)

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            nexusmind/nexusmind-backend:${{ steps.version.outputs.VERSION }}
            nexusmind/nexusmind-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            nexusmind/nexusmind-frontend:${{ steps.version.outputs.VERSION }}
            nexusmind/nexusmind-frontend:latest

      - name: Update Docker Hub description
        run: |
          # This would typically use Docker Hub API to update descriptions
          echo "Release v${{ steps.version.outputs.VERSION }} published successfully"
