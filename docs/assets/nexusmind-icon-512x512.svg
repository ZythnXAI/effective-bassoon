<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient)" />
  
  <!-- Outer hexagon -->
  <polygon 
    points="256,20 400,120 400,392 256,492 112,392 112,120" 
    fill="none" 
    stroke="white" 
    stroke-width="4" 
    filter="url(#glow)"
  />
  
  <!-- Inner hexagon glow -->
  <polygon 
    points="256,40 380,100 380,412 256,472 132,412 132,100" 
    fill="url(#innerGlow)" 
    opacity="0.3"
  />
  
  <!-- Neural network pattern -->
  <g fill="none" stroke="white" stroke-width="3" opacity="0.9">
    <!-- Outer circle -->
    <circle cx="256" cy="256" r="180" />
    
    <!-- Nodes -->
    <circle cx="156" cy="156" r="8" fill="white" />
    <circle cx="356" cy="156" r="8" fill="white" />
    <circle cx="156" cy="356" r="8" fill="white" />
    <circle cx="356" cy="356" r="8" fill="white" />
    <circle cx="256" cy="86" r="8" fill="white" />
    <circle cx="256" cy="426" r="8" fill="white" />
    <circle cx="86" cy="256" r="8" fill="white" />
    <circle cx="426" cy="256" r="8" fill="white" />
    
    <!-- Connections -->
    <line x1="156" y1="156" x2="256" y2="86" />
    <line x1="356" y1="156" x2="256" y2="86" />
    <line x1="156" y1="356" x2="256" y2="426" />
    <line x1="356" y1="356" x2="256" y2="426" />
    <line x1="86" y1="256" x2="256" y2="256" />
    <line x1="426" y1="256" x2="256" y2="256" />
    
    <!-- Inner connections -->
    <line x1="156" y1="156" x2="356" y2="156" />
    <line x1="156" y1="356" x2="356" y2="356" />
    <line x1="86" y1="256" x2="426" y2="256" />
    <line x1="256" y1="86" x2="256" y2="426" />
  </g>
  
  <!-- Center icon -->
  <g transform="translate(256, 256)">
    <!-- Outer hexagon for center -->
    <polygon 
      points="-40,-20 -20,-40 20,-40 40,-20 40,20 20,40 -20,40 -40,20" 
      fill="none" 
      stroke="white" 
      stroke-width="2"
    />
    
    <!-- Sparkles -->
    <path d="M-30,-10 L-20,-20 L-10,-10 L-20,0 Z" fill="white" />
    <path d="M30,-10 L40,-20 L50,-10 L40,0 Z" fill="white" />
    <path d="M-30,10 L-20,20 L-10,10 L-20,0 Z" fill="white" />
    <path d="M30,10 L40,20 L50,10 L40,0 Z" fill="white" />
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="white" />
    
    <!-- Inner sparkle -->
    <path d="M-8,-8 L0,-12 L8,-8 L0,-4 L8,0 L0,4 L8,8 L0,12 L-8,8 L-8,0 Z" fill="#3B82F6" />
  </g>
  
  <!-- Text ring -->
  <g transform="rotate(-90 256 256)">
    <text 
      x="256" 
      y="180" 
      font-family="Inter, sans-serif" 
      font-size="24" 
      font-weight="700" 
      fill="white" 
      text-anchor="middle"
      dominant-baseline="middle"
    >
      NEXUSMIND
    </text>
  </g>
  
  <g transform="rotate(90 256 256)">
    <text 
      x="256" 
      y="332" 
      font-family="Inter, sans-serif" 
      font-size="16" 
      font-weight="500" 
      fill="rgba(255,255,255,0.9)" 
      text-anchor="middle"
      dominant-baseline="middle"
    >
      AI
    </text>
  </g>
</svg>
