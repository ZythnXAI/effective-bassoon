<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#gradient)" />
  
  <!-- Outer hexagon -->
  <polygon 
    points="128,20 200,60 200,236 128,276 56,236 56,60" 
    fill="none" 
    stroke="white" 
    stroke-width="2" 
    filter="url(#glow)"
  />
  
  <!-- Neural network pattern -->
  <g fill="none" stroke="white" stroke-width="1.5" opacity="0.9">
    <!-- Outer circle -->
    <circle cx="128" cy="128" r="90" />
    
    <!-- Nodes -->
    <circle cx="78" cy="78" r="4" fill="white" />
    <circle cx="178" cy="78" r="4" fill="white" />
    <circle cx="78" cy="178" r="4" fill="white" />
    <circle cx="178" cy="178" r="4" fill="white" />
    <circle cx="128" cy="43" r="4" fill="white" />
    <circle cx="128" cy="213" r="4" fill="white" />
    <circle cx="43" cy="128" r="4" fill="white" />
    <circle cx="213" cy="128" r="4" fill="white" />
    
    <!-- Connections -->
    <line x1="78" y1="78" x2="128" y2="43" />
    <line x1="178" y1="78" x2="128" y2="43" />
    <line x1="78" y1="178" x2="128" y2="213" />
    <line x1="178" y1="178" x2="128" y2="213" />
    <line x1="43" y1="128" x2="128" y2="128" />
    <line x1="213" y1="128" x2="128" y2="128" />
    
    <!-- Inner connections -->
    <line x1="78" y1="78" x2="178" y2="78" />
    <line x1="78" y1="178" x2="178" y2="178" />
    <line x1="43" y1="128" x2="213" y2="128" />
    <line x1="128" y1="43" x2="128" y2="213" />
  </g>
  
  <!-- Center icon -->
  <g transform="translate(128, 128)">
    <!-- Sparkles -->
    <path d="M-15,-5 L-10,-10 L-5,-5 L-10,0 Z" fill="white" />
    <path d="M15,-5 L20,-10 L25,-5 L20,0 Z" fill="white" />
    <path d="M-15,5 L-10,10 L-5,5 L-10,0 Z" fill="white" />
    <path d="M15,5 L20,10 L25,5 L20,0 Z" fill="white" />
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="white" />
    
    <!-- Inner sparkle -->
    <path d="M-4,-4 L0,-6 L4,-4 L0,-2 L4,0 L0,2 L4,4 L0,6 L-4,4 L-4,0 Z" fill="#3B82F6" />
  </g>
</svg>
