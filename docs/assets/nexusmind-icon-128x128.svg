<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#gradient)" />
  
  <!-- Outer hexagon -->
  <polygon 
    points="64,10 100,30 100,118 64,138 28,118 28,30" 
    fill="none" 
    stroke="white" 
    stroke-width="1.5"
  />
  
  <!-- Neural network pattern -->
  <g fill="none" stroke="white" stroke-width="1" opacity="0.9">
    <!-- Outer circle -->
    <circle cx="64" cy="64" r="45" />
    
    <!-- Nodes -->
    <circle cx="39" cy="39" r="2" fill="white" />
    <circle cx="89" cy="39" r="2" fill="white" />
    <circle cx="39" cy="89" r="2" fill="white" />
    <circle cx="89" cy="89" r="2" fill="white" />
    <circle cx="64" cy="22" r="2" fill="white" />
    <circle cx="64" cy="106" r="2" fill="white" />
    <circle cx="22" cy="64" r="2" fill="white" />
    <circle cx="106" cy="64" r="2" fill="white" />
    
    <!-- Connections -->
    <line x1="39" y1="39" x2="64" y2="22" />
    <line x1="89" y1="39" x2="64" y2="22" />
    <line x1="39" y1="89" x2="64" y2="106" />
    <line x1="89" y1="89" x2="64" y2="106" />
    <line x1="22" y1="64" x2="64" y2="64" />
    <line x1="106" y1="64" x2="64" y2="64" />
    
    <!-- Inner connections -->
    <line x1="39" y1="39" x2="89" y2="39" />
    <line x1="39" y1="89" x2="89" y2="89" />
    <line x1="22" y1="64" x2="106" y2="64" />
    <line x1="64" y1="22" x2="64" y2="106" />
  </g>
  
  <!-- Center icon -->
  <g transform="translate(64, 64)">
    <!-- Sparkles -->
    <path d="M-7,-2 L-5,-4 L-3,-2 L-5,0 Z" fill="white" />
    <path d="M7,-2 L9,-4 L11,-2 L9,0 Z" fill="white" />
    <path d="M-7,2 L-5,4 L-3,2 L-5,0 Z" fill="white" />
    <path d="M7,2 L9,4 L11,2 L9,0 Z" fill="white" />
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="3" fill="white" />
    
    <!-- Inner sparkle -->
    <path d="M-2,-2 L0,-3 L2,-2 L0,-1 L2,0 L0,1 L2,2 L0,3 L-2,2 L-2,0 Z" fill="#3B82F6" />
  </g>
</svg>
