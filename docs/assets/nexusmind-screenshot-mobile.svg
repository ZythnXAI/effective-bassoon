<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="messageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="50" y="50" width="300" height="700" fill="#000" rx="30" />
  <rect x="60" y="60" width="280" height="680" fill="url(#bgGradient)" rx="20" filter="url(#shadow)" />

  <!-- Status Bar -->
  <rect x="60" y="60" width="280" height="30" fill="#000" rx="20" rx="20" ry="0" />
  <text x="80" y="80" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="start">12:34</text>
  <g transform="translate(240, 75)">
    <rect x="0" y="0" width="15" height="8" fill="#EF4444" rx="2" />
    <rect x="20" y="0" width="15" height="8" fill="#F59E0B" rx="2" />
    <rect x="40" y="0" width="15" height="8" fill="#10B981" rx="2" />
  </g>

  <!-- Header -->
  <rect x="60" y="90" width="280" height="50" fill="#1E293B" />
  <polygon points="80,115 70,110 70,120" fill="#94A3B8" />
  <text x="110" y="118" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="start" font-weight="600">NexusMind</text>
  <circle cx="290" cy="115" r="10" fill="#3B82F6" />

  <!-- Chat Area -->
  <g transform="translate(60, 140)">
    <!-- Messages -->
    <g transform="translate(20, 0)">
      <!-- User Message -->
      <rect x="150" y="0" width="180" height="45" fill="#3B82F6" rx="12" />
      <text x="160" y="20" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Hello!</text>
      <text x="160" y="32" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">How are you?</text>

      <!-- AI Response -->
      <g transform="translate(0, 60)">
        <rect x="10" y="0" width="250" height="80" fill="#1E293B" rx="12" />
        <text x="20" y="18" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Hi! I'm doing great. I'm an AI</text>
        <text x="20" y="32" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">assistant ready to help you with</text>
        <text x="20" y="46" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">anything. What can I do for you?</text>
        <circle cx="245" cy="70" r="8" fill="url(#messageGradient)" />
      </g>

      <!-- User Message 2 -->
      <rect x="150" y="160" width="180" height="30" fill="#3B82F6" rx="12" />
      <text x="160" y="180" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Tell me a joke</text>

      <!-- AI Response 2 -->
      <g transform="translate(0, 210)">
        <rect x="10" y="0" width="250" height="60" fill="#1E293B" rx="12" />
        <text x="20" y="18" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Why don't scientists trust atoms?</text>
        <text x="20" y="34" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Because they make up everything!</text>
        <circle cx="245" cy="50" r="8" fill="url(#messageGradient)" />
      </g>

      <!-- User Message 3 -->
      <rect x="150" y="290" width="200" height="30" fill="#3B82F6" rx="12" />
      <text x="160" y="310" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">That's a good one!</text>

      <!-- AI Response 3 -->
      <g transform="translate(0, 340)">
        <rect x="10" y="0" width="250" height="40" fill="#1E293B" rx="12" />
        <text x="20" y="22" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="start">Glad you liked it!</text>
        <circle cx="245" cy="30" r="8" fill="url(#messageGradient)" />
      </g>
    </g>

    <!-- Streaming Indicator -->
    <g transform="translate(20, 400)">
      <rect x="10" y="0" width="100" height="20" fill="#1E293B" rx="12" />
      <text x="15" y="15" font-family="Inter, sans-serif" font-size="10" fill="#3B82F6" text-anchor="start">AI is typing</text>
      <circle cx="80" cy="10" r="1.5" fill="#3B82F6" opacity="0.6">
        <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="88" cy="10" r="1.5" fill="#3B82F6" opacity="0.6">
        <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" repeatCount="indefinite" begin="0.2s" />
      </circle>
      <circle cx="96" cy="10" r="1.5" fill="#3B82F6" opacity="0.6">
        <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" repeatCount="indefinite" begin="0.4s" />
      </circle>
    </g>
  </g>

  <!-- Input Area -->
  <rect x="70" y="680" width="260" height="40" fill="#1E293B" rx="20" />
  <text x="80" y="705" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8" text-anchor="start">Type a message...</text>
  <circle cx="300" cy="700" r="15" fill="#3B82F6" />
  <polygon points="300,700 305,695 305,705" fill="white" />

  <!-- Bottom Navigation -->
  <rect x="60" y="730" width="280" height="50" fill="#1E293B" />
  <g transform="translate(60, 730)">
    <rect x="10" y="10" width="50" height="30" fill="#3B82F6" rx="8" />
    <text x="35" y="30" font-family="Inter, sans-serif" font-size="8" fill="white" text-anchor="middle">Chat</text>
    
    <rect x="80" y="10" width="50" height="30" fill="#1E293B" rx="8" />
    <text x="105" y="30" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">Models</text>
    
    <rect x="150" y="10" width="50" height="30" fill="#1E293B" rx="8" />
    <text x="175" y="30" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">History</text>
    
    <rect x="220" y="10" width="50" height="30" fill="#1E293B" rx="8" />
    <text x="245" y="30" font-family="Inter, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">Settings</text>
  </g>

  <!-- Phone Bezel -->
  <rect x="50" y="50" width="300" height="700" fill="none" stroke="#333" stroke-width="2" rx="30" />

  <!-- Title -->
  <text x="200" y="40" font-family="Inter, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">NexusMind AI - Mobile</text>
</svg>
