<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sidebarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="messageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)" />

  <!-- Main Container -->
  <g filter="url(#shadow)">
    <!-- Sidebar -->
    <rect x="0" y="0" width="280" height="800" fill="url(#sidebarGradient)" rx="8" />
    
    <!-- Logo -->
    <g transform="translate(20, 20)">
      <polygon points="50,10 90,35 90,85 50,110 10,85 10,35" fill="url(#messageGradient)" opacity="0.9" />
      <g fill="none" stroke="white" stroke-width="1.5" opacity="0.9">
        <circle cx="50" cy="60" r="30" stroke="rgba(255,255,255,0.3)" />
        <circle cx="50" cy="60" r="20" stroke="rgba(255,255,255,0.5)" />
        <circle cx="30" cy="40" r="2" fill="white" />
        <circle cx="70" cy="40" r="2" fill="white" />
        <circle cx="30" cy="80" r="2" fill="white" />
        <circle cx="70" cy="80" r="2" fill="white" />
        <line x1="30" y1="40" x2="50" y2="60" stroke="white" />
        <line x1="70" y1="40" x2="50" y2="60" stroke="white" />
        <line x1="30" y1="80" x2="50" y2="60" stroke="white" />
        <line x1="70" y1="80" x2="50" y2="60" stroke="white" />
      </g>
      <text x="50" y="125" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="600">NEXUSMIND</text>
    </g>

    <!-- New Chat Button -->
    <rect x="20" y="100" width="240" height="40" fill="#3B82F6" rx="8" />
    <text x="140" y="125" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="500">+ New Chat</text>

    <!-- Model Selector -->
    <rect x="20" y="160" width="240" height="40" fill="#1E293B" rx="8" />
    <text x="30" y="185" font-family="Inter, sans-serif" font-size="12" fill="#94A3B8" text-anchor="start">Model:</text>
    <text x="100" y="185" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="start">llama-3-8b</text>
    <polygon points="250,180 240,180 240,190" fill="#94A3B8" />

    <!-- Conversation List -->
    <text x="30" y="230" font-family="Inter, sans-serif" font-size="11" fill="#64748B" text-anchor="start">Today</text>
    
    <rect x="20" y="250" width="240" height="40" fill="#334155" rx="6" />
    <text x="30" y="275" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="start">Chat with Llama 3</text>
    
    <rect x="20" y="295" width="240" height="40" fill="#334155" rx="6" />
    <text x="30" y="320" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="start">Code Review</text>
    
    <rect x="20" y="340" width="240" height="40" fill="#334155" rx="6" />
    <text x="30" y="365" font-family="Inter, sans-serif" font-size="12" fill="white" text-anchor="start">Brainstorming</text>

    <!-- Chat Area -->
    <rect x="280" y="0" width="920" height="800" fill="#0F172A" />

    <!-- Navbar -->
    <rect x="280" y="0" width="920" height="60" fill="#1E293B" />
    <text x="300" y="38" font-family="Inter, sans-serif" font-size="14" fill="white" text-anchor="start" font-weight="500">Chat with Llama 3</text>
    
    <!-- User Avatar -->
    <circle cx="1180" cy="30" r="15" fill="#3B82F6" />
    <text x="1180" y="38" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">U</text>

    <!-- Chat Messages -->
    <g transform="translate(280, 80)">
      <!-- User Message -->
      <g transform="translate(800, 20)">
        <rect x="0" y="0" width="300" height="60" fill="#3B82F6" rx="12" rx="12" ry="12" />
        <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">Hello! How are you today?</text>
        <circle cx="285" cy="50" r="8" fill="#94A3B8" />
      </g>

      <!-- AI Response -->
      <g transform="translate(100, 100)">
        <rect x="0" y="0" width="700" height="120" fill="#1E293B" rx="12" />
        <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">Hello! I'm doing great, thank you for asking. I'm an AI assistant</text>
        <text x="15" y="45" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">powered by Llama 3, ready to help you with any questions or</text>
        <text x="15" y="65" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">tasks you might have. How can I assist you today?</text>
        <circle cx="685" cy="110" r="12" fill="url(#messageGradient)" />
      </g>

      <!-- User Message 2 -->
      <g transform="translate(800, 220)">
        <rect x="0" y="0" width="350" height="40" fill="#3B82F6" rx="12" />
        <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">What can you help me with?</text>
        <circle cx="335" cy="30" r="8" fill="#94A3B8" />
      </g>

      <!-- AI Response 2 -->
      <g transform="translate(100, 280)">
        <rect x="0" y="0" width="700" height="200" fill="#1E293B" rx="12" />
        <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">I can help you with a wide variety of tasks! Here are some</text>
        <text x="15" y="45" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">examples:</text>
        <text x="15" y="70" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- Answer questions and provide explanations</text>
        <text x="15" y="90" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- Write and debug code</text>
        <text x="15" y="110" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- Generate creative content (stories, poems, etc.)</text>
        <text x="15" y="130" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- Help with learning and studying</text>
        <text x="15" y="150" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- Provide recommendations and advice</text>
        <text x="15" y="170" font-family="Inter, sans-serif" font-size="13" fill="white" text-anchor="start">- And much more!</text>
        <circle cx="685" cy="190" r="12" fill="url(#messageGradient)" />
      </g>

      <!-- Streaming Indicator -->
      <g transform="translate(100, 490)">
        <rect x="0" y="0" width="700" height="20" fill="#1E293B" rx="12" />
        <text x="15" y="15" font-family="Inter, sans-serif" font-size="12" fill="#3B82F6" text-anchor="start">AI is typing...</text>
        <circle cx="50" cy="10" r="2" fill="#3B82F6" opacity="0.6">
          <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="60" cy="10" r="2" fill="#3B82F6" opacity="0.6">
          <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" begin="0.2s" />
        </circle>
        <circle cx="70" cy="10" r="2" fill="#3B82F6" opacity="0.6">
          <animate attributeName="r" values="2;4;2" dur="1.5s" repeatCount="indefinite" begin="0.4s" />
        </circle>
      </g>
    </g>

    <!-- Chat Input -->
    <rect x="300" y="700" width="880" height="50" fill="#1E293B" rx="8" />
    <text x="320" y="730" font-family="Inter, sans-serif" font-size="13" fill="#94A3B8" text-anchor="start">Type a message...</text>
    
    <!-- Send Button -->
    <circle cx="1150" cy="725" r="20" fill="#3B82F6" />
    <polygon points="1150,725 1155,720 1155,730" fill="white" />
  </g>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#334155" stroke-width="1" rx="12" />
  
  <!-- Window Controls -->
  <circle cx="30" cy="30" r="8" fill="#EF4444" />
  <circle cx="50" cy="30" r="8" fill="#F59E0B" />
  <circle cx="70" cy="30" r="8" fill="#10B981" />

  <!-- Title -->
  <text x="600" y="50" font-family="Inter, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="600">NexusMind AI - Chat Interface</text>
</svg>
