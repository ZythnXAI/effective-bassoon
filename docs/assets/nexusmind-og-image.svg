<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient2)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5" />
  
  <!-- Gradient overlay -->
  <rect width="1200" height="630" fill="url(#gradient1)" opacity="0.15" />
  
  <!-- Neural network background -->
  <g fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    
    <circle cx="100" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="200" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="300" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="400" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="500" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="600" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="700" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="800" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="900" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="1000" cy="100" r="3" fill="white" opacity="0.3" />
    <circle cx="1100" cy="100" r="3" fill="white" opacity="0.3" />
  </g>
  
  <!-- Left side - Logo and Title -->
  <g transform="translate(100, 150)">
    <!-- Large Hexagon -->
    <polygon 
      points="0,0 150,40 150,120 0,160 -75,120 -75,40" 
      fill="none" 
      stroke="url(#gradient1)" 
      stroke-width="3" 
      filter="url(#glow)"
    />
    
    <!-- Neural network inside hexagon -->
    <g fill="none" stroke="white" stroke-width="2">
      <circle cx="0" cy="80" r="20" />
      <circle cx="75" cy="80" r="20" />
      <circle cx="37.5" cy="40" r="20" />
      <circle cx="37.5" cy="120" r="20" />
      <line x1="0" y1="80" x2="37.5" y2="40" />
      <line x1="75" y1="80" x2="37.5" y2="40" />
      <line x1="0" y1="80" x2="37.5" y2="120" />
      <line x1="75" y1="80" x2="37.5" y2="120" />
      <line x1="37.5" y1="40" x2="37.5" y2="120" />
      <circle cx="0" cy="80" r="5" fill="white" />
      <circle cx="75" cy="80" r="5" fill="white" />
      <circle cx="37.5" cy="40" r="5" fill="white" />
      <circle cx="37.5" cy="120" r="5" fill="white" />
    </g>
    
    <!-- Sparkle icons -->
    <g fill="white">
      <path d="M-30,50 L-20,70 L-10,50 L-20,30 Z" />
      <path d="M100,50 L110,70 L120,50 L110,30 Z" />
      <path d="M-15,10 L0,30 L15,10 L0,-10 Z" />
      <path d="M55,10 L70,30 L85,10 L70,-10 Z" />
      <path d="M-30,110 L-20,130 L-10,110 L-20,90 Z" />
      <path d="M100,110 L110,130 L120,110 L110,90 Z" />
    </g>
  </g>
  
  <!-- Text -->
  <g transform="translate(100, 150)">
    <text x="180" y="80" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="white">
      NEXUSMIND
    </text>
    <text x="180" y="150" font-family="Inter, sans-serif" font-size="32" font-weight="500" fill="rgba(255,255,255,0.9)">
      AI
    </text>
  </g>
  
  <!-- Tagline -->
  <text x="100" y="280" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.7)">
    Connecting Intelligence, Empowering Innovation
  </text>
  
  <!-- Right side - Interface Preview -->
  <g transform="translate(650, 100)">
    <!-- Browser mockup -->
    <rect x="0" y="0" width="500" height="400" rx="20" ry="20" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
    
    <!-- Browser header -->
    <rect x="10" y="10" width="480" height="40" rx="10" ry="10" fill="rgba(30,41,59,0.8)" />
    <circle cx="25" cy="30" r="6" fill="#EF4444" />
    <circle cx="40" cy="30" r="6" fill="#F59E0B" />
    <circle cx="55" cy="30" r="6" fill="#10B981" />
    
    <!-- Address bar -->
    <rect x="70" y="20" width="350" height="20" rx="10" ry="10" fill="rgba(51,65,85,0.8)" />
    <text x="80" y="32" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">
      nexusmind.ai
    </text>
    
    <!-- Sidebar -->
    <rect x="20" y="70" width="150" height="280" rx="10" ry="10" fill="rgba(30,41,59,0.6)" />
    
    <!-- New chat button -->
    <rect x="30" y="80" width="130" height="30" rx="8" ry="8" fill="url(#gradient1)" />
    <text x="95" y="100" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">
      + New Chat
    </text>
    
    <!-- Conversation items -->
    <rect x="30" y="125" width="130" height="25" rx="6" ry="6" fill="rgba(51,65,85,0.5)" />
    <text x="40" y="142" font-family="Inter, sans-serif" font-size="11" fill="white">
      Project Discussion
    </text>
    
    <rect x="30" y="160" width="130" height="25" rx="6" ry="6" fill="rgba(51,65,85,0.5)" />
    <text x="40" y="177" font-family="Inter, sans-serif" font-size="11" fill="white">
      Code Review
    </text>
    
    <rect x="30" y="195" width="130" height="25" rx="6" ry="6" fill="rgba(51,65,85,0.5)" />
    <text x="40" y="212" font-family="Inter, sans-serif" font-size="11" fill="white">
      Brainstorming
    </text>
    
    <!-- Chat area -->
    <rect x="180" y="70" width="290" height="280" rx="10" ry="10" fill="rgba(15,23,42,0.4)" />
    
    <!-- Messages -->
    <rect x="200" y="90" width="180" height="40" rx="12" ry="12" fill="rgba(59,130,246,0.3)" />
    <text x="210" y="115" font-family="Inter, sans-serif" font-size="11" fill="white">
      Hello! How can I help?
    </text>
    
    <rect x="200" y="145" width="250" height="40" rx="12" ry="12" fill="rgba(139,92,246,0.3)" />
    <text x="210" y="170" font-family="Inter, sans-serif" font-size="11" fill="white">
      I need help with my Python code
    </text>
    
    <rect x="200" y="200" width="220" height="40" rx="12" ry="12" fill="rgba(59,130,246,0.3)" />
    <text x="210" y="225" font-family="Inter, sans-serif" font-size="11" fill="white">
      Sure! What's the issue?
    </text>
    
    <!-- Input area -->
    <rect x="200" y="330" width="270" height="30" rx="12" ry="12" fill="rgba(30,41,59,0.8)" />
    <text x="210" y="350" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">
      Type a message...
    </text>
    
    <!-- Send button -->
    <circle cx="460" cy="345" r="12" fill="url(#gradient1)" />
    <path d="M455,340 L465,345 L455,350 Z" fill="white" />
  </g>
  
  <!-- Bottom - Features -->
  <g transform="translate(100, 520)">
    <g transform="translate(0, 0)">
      <circle cx="15" cy="15" r="8" fill="#3B82F6" />
      <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white">
        Multi-AI Platform
      </text>
    </g>
    
    <g transform="translate(200, 0)">
      <circle cx="15" cy="15" r="8" fill="#8B5CF6" />
      <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white">
        Real-Time Chat
      </text>
    </g>
    
    <g transform="translate(400, 0)">
      <circle cx="15" cy="15" r="8" fill="#EC4899" />
      <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white">
        8+ AI Providers
      </text>
    </g>
    
    <g transform="translate(600, 0)">
      <circle cx="15" cy="15" r="8" fill="#10B981" />
      <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white">
        Open Source
      </text>
    </g>
    
    <g transform="translate(800, 0)">
      <circle cx="15" cy="15" r="8" fill="#F59E0B" />
      <text x="40" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="white">
        Free to Use
      </text>
    </g>
  </g>
  
  <!-- Bottom right - Social icons -->
  <g transform="translate(1050, 580)">
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.8)">
      nexusmind.ai
    </text>
    
    <a href="https://github.com/ZythnXAI/effective-bassoon" transform="translate(-100, 0)">
      <circle cx="0" cy="0" r="15" fill="white" opacity="0.2" />
      <path d="M-7,-7 L-7,-3 L-11,0 L-7,3 L-7,7 L-3,7 L-3,11 L3,11 L3,7 L7,7 L7,3 L3,0 L7,-3 L7,-7 L3,-7 L3,-11 L-3,-11 L-3,-7 Z" fill="white" transform="translate(-8, -8)" />
    </a>
    
    <a href="https://discord.gg/nexusmind" transform="translate(-50, 0)">
      <circle cx="0" cy="0" r="15" fill="white" opacity="0.2" />
      <path d="M-8,0 C-8,-4 0,-8 8,-8 C12,-8 16,-4 16,0 C16,4 12,8 8,8 C0,8 -8,4 -8,0 Z M0,0 C0,-3 2,-5 5,-5 C8,-5 10,-3 10,0 C10,3 8,5 5,5 C2,5 0,3 0,0 Z" fill="white" transform="translate(-8, -8)" />
    </a>
    
    <a href="https://twitter.com/NexusMindAI">
      <circle cx="0" cy="0" r="15" fill="white" opacity="0.2" />
      <path d="M-8,-2 C-8,-6 -2,-8 2,-8 C6,-8 8,-6 8,-2 C8,2 6,6 2,6 C-2,6 -8,2 -8,-2 Z M0,0 L6,0 L8,-2 L8,2 L6,0 L0,6 L-6,0 L-8,2 L-8,-2 L-6,0 Z" fill="white" transform="translate(-8, -8)" />
    </a>
  </g>
</svg>
