<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)" />
  
  <!-- Neural network pattern -->
  <g fill="none" stroke="white" stroke-width="1.5" opacity="0.9">
    <circle cx="50" cy="50" r="35" stroke="rgba(255,255,255,0.4)" />
    <circle cx="50" cy="50" r="25" stroke="rgba(255,255,255,0.6)" />
    
    <!-- Neural nodes -->
    <circle cx="30" cy="30" r="2" fill="white" />
    <circle cx="70" cy="30" r="2" fill="white" />
    <circle cx="30" cy="70" r="2" fill="white" />
    <circle cx="70" cy="70" r="2" fill="white" />
    <circle cx="50" cy="20" r="2" fill="white" />
    <circle cx="50" cy="80" r="2" fill="white" />
    <circle cx="20" cy="50" r="2" fill="white" />
    <circle cx="80" cy="50" r="2" fill="white" />
    
    <!-- Connections -->
    <line x1="30" y1="30" x2="50" y2="20" stroke="white" />
    <line x1="70" y1="30" x2="50" y2="20" stroke="white" />
    <line x1="30" y1="70" x2="50" y2="80" stroke="white" />
    <line x1="70" y1="70" x2="50" y2="80" stroke="white" />
    <line x1="20" y1="50" x2="50" y2="50" stroke="white" />
    <line x1="80" y1="50" x2="50" y2="50" stroke="white" />
  </g>
  
  <!-- Center icon -->
  <g transform="translate(50, 50)">
    <path 
      d="M-7.5,-5 L-2.5,-10 L2.5,-10 L7.5,-5 L10,0 L7.5,5 L2.5,10 L-2.5,10 L-7.5,5 L-10,0 Z"
      fill="white"
      opacity="0.9"
    />
    <circle cx="0" cy="0" r="3" fill="white" />
  </g>
</svg>
