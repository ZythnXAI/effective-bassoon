<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background hexagon -->
  <polygon 
    points="100,20 180,50 180,150 100,180 20,150 20,50" 
    fill="url(#gradient)" 
    opacity="0.8"
    filter="url(#glow)"
  />
  
  <!-- Neural network pattern -->
  <g fill="none" stroke="white" stroke-width="2" opacity="0.9">
    <!-- Outer connections -->
    <circle cx="100" cy="100" r="80" stroke="rgba(255,255,255,0.3)" />
    <circle cx="100" cy="100" r="60" stroke="rgba(255,255,255,0.5)" />
    <circle cx="100" cy="100" r="40" stroke="rgba(255,255,255,0.7)" />
    
    <!-- Neural nodes -->
    <circle cx="60" cy="60" r="4" fill="white" />
    <circle cx="140" cy="60" r="4" fill="white" />
    <circle cx="60" cy="140" r="4" fill="white" />
    <circle cx="140" cy="140" r="4" fill="white" />
    <circle cx="100" cy="40" r="4" fill="white" />
    <circle cx="100" cy="160" r="4" fill="white" />
    <circle cx="40" cy="100" r="4" fill="white" />
    <circle cx="160" cy="100" r="4" fill="white" />
    
    <!-- Connections -->
    <line x1="60" y1="60" x2="100" y2="40" stroke="white" stroke-width="1.5" />
    <line x1="140" y1="60" x2="100" y2="40" stroke="white" stroke-width="1.5" />
    <line x1="60" y1="140" x2="100" y2="160" stroke="white" stroke-width="1.5" />
    <line x1="140" y1="140" x2="100" y2="160" stroke="white" stroke-width="1.5" />
    <line x1="40" y1="100" x2="100" y2="100" stroke="white" stroke-width="1.5" />
    <line x1="160" y1="100" x2="100" y2="100" stroke="white" stroke-width="1.5" />
  </g>
  
  <!-- Center icon -->
  <g transform="translate(100, 100)">
    <path 
      d="M-15,-10 L-5,-20 L5,-20 L15,-10 L20,0 L15,10 L5,20 L-5,20 L-15,10 L-20,0 Z"
      fill="white"
      opacity="0.9"
    />
    <circle cx="0" cy="0" r="6" fill="white" />
  </g>
  
  <!-- Text -->
  <text 
    x="100" 
    y="195" 
    font-family="Inter, sans-serif" 
    font-size="14" 
    fill="white" 
    text-anchor="middle"
    font-weight="600"
  >
    NEXUSMIND
  </text>
</svg>
